[tool.poetry]
name = "airosense-backend"
version = "0.1.0"
description = "FastAPI backend for the AiroSense air quality prediction platform"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.114.1"
uvicorn = { extras = ["standard"], version = "0.30.1" }
httpx = "0.27.0"
pydantic = "2.8.2"
pydantic-settings = "2.2.1"
sqlalchemy = "2.0.30"
alembic = "1.13.2"
psycopg = { version = "3.1.18", extras = ["binary"] }
redis = "5.0.4"
celery = "5.3.6"
pendulum = "3.0.0"
python-dotenv = "1.0.1"
loguru = "0.7.2"
structlog = "24.1.0"
feast = "0.37.0"
boto3 = "1.34.90"
s3fs = "2024.6.0"
scikit-learn = "1.4.2"
lightgbm = "4.3.0"
xgboost = "2.1.1"
onnxruntime = "1.18.0"
mlflow = "2.14.1"
optuna = "3.6.1"
shap = "0.45.0"
pandas = "2.2.2"
numpy = "1.26.4"
pyarrow = "16.1.0"
fastapi-versioning = "0.10.1"
fastapi-limiter = "0.1.6"
fastapi-pagination = "0.12.15"
starlette-exporter = "0.19.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.1"
pytest-asyncio = "0.23.7"
pytest-cov = "5.0.0"
httpx = { version = "0.27.0", extras = ["cli"] }
ruff = "0.5.5"
black = "24.4.2"
pre-commit = "3.7.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
